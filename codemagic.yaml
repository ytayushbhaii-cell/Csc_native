workflows:
  csc-smart-toolkit-android:
    name: CSC Smart Toolkit — Android Release
    max_build_duration: 90
    environment:
      vars:
        PACKAGE_NAME: "com.cscsmarttoolkit.app"
        # Prevent corepack from blocking pnpm when the CI machine's working
        # directory has a package.json with "packageManager": "yarn@...".
        COREPACK_ENABLE_STRICT: "0"
      node: 20.18.0
      java: 17

    scripts:
      # ── 1. Install pnpm ────────────────────────────────────────────────────
      # Codemagic ships with corepack; disable it first so npm's global pnpm
      # binary is used directly (not wrapped by corepack's package-manager shim).
      - name: Install pnpm
        script: |
          corepack disable 2>/dev/null || true
          npm install -g pnpm@10.26.1 --force
          pnpm --version

      # ── 2. JS dependencies (pnpm workspace) ───────────────────────────────
      - name: Install JS dependencies
        script: |
          cd $CM_BUILD_DIR/Offline-Smart-Toolkit
          pnpm install --no-frozen-lockfile

      # ── 3. Mobile npm dependencies (required for Gradle autolinking) ──────
      # npm ci installs all native modules into artifacts/mobile/node_modules so
      # that `react-native config` (called by autolinkLibrariesFromCommand()
      # during the Gradle configure phase) can discover and link every native
      # module. package-lock.json pins exact versions.
      - name: Install mobile npm dependencies
        script: |
          node --version
          npm --version
          cd $CM_BUILD_DIR/Offline-Smart-Toolkit/artifacts/mobile
          npm ci

      # ── 3b. Pre-build RN Gradle plugin JARs ──────────────────────────────
      # com.facebook.react.settings lives in a nested composite build inside
      # @react-native/gradle-plugin and is NOT exposed via includeBuild alone.
      # The settings.gradle loads it via buildscript classpath instead, which
      # requires the pre-compiled JARs. The npm package does not ship them, so
      # we build them here using the android gradlew with --project-dir.
      - name: Pre-build RN Gradle plugin JARs
        script: |
          MOBILE="$CM_BUILD_DIR/Offline-Smart-Toolkit/artifacts/mobile"
          RN_PLUGIN="$MOBILE/node_modules/@react-native/gradle-plugin"
          SJAR="$RN_PLUGIN/settings-plugin/build/libs/settings-plugin.jar"
          HJAR="$RN_PLUGIN/shared/build/libs/shared.jar"

          if [ -f "$SJAR" ] && [ -f "$HJAR" ]; then
            echo "✓ JARs already present — skipping build"
            ls -lh "$SJAR" "$HJAR"
            exit 0
          fi

          echo "⚠ JARs missing — building :settings-plugin:jar and :shared:jar..."
          cd "$MOBILE/android"
          chmod +x gradlew
          ./gradlew \
            --project-dir "$RN_PLUGIN" \
            :settings-plugin:jar :shared:jar \
            --no-daemon --console=plain --stacktrace \
            2>&1 | tail -60

          ls -lh "$SJAR" && echo "✓ settings-plugin.jar built"
          ls -lh "$HJAR" && echo "✓ shared.jar built"

      # ── 4. Android SDK components & local.properties ──────────────────────
      # Codemagic exposes the Android SDK as ANDROID_HOME on all machine types;
      # ANDROID_SDK_ROOT is a deprecated alias — accept either.
      - name: Accept Android SDK licences & install components
        script: |
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            2>/dev/null || true
          ANDROID_SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$ANDROID_SDK" ]; then
            echo "ERROR: Neither ANDROID_SDK_ROOT nor ANDROID_HOME is set"
            exit 1
          fi
          echo "sdk.dir=$ANDROID_SDK" > \
            "$CM_BUILD_DIR/Offline-Smart-Toolkit/artifacts/mobile/android/local.properties"
          echo "✓ local.properties:"
          cat "$CM_BUILD_DIR/Offline-Smart-Toolkit/artifacts/mobile/android/local.properties"

      # ── 5. Verify signing files ────────────────────────────────────────────
      - name: Verify signing files
        script: |
          KEY="$CM_BUILD_DIR/Offline-Smart-Toolkit/artifacts/mobile/android/key.properties"
          KS="$CM_BUILD_DIR/Offline-Smart-Toolkit/artifacts/mobile/android/app/release.keystore"
          [ -f "$KEY" ] && echo "✓ key.properties found" || { echo "✗ MISSING: key.properties"; exit 1; }
          [ -f "$KS"  ] && echo "✓ release.keystore found" || { echo "✗ MISSING: release.keystore"; exit 1; }
          echo "  storeFile : $(grep storeFile  "$KEY" | cut -d= -f2)"
          echo "  keyAlias  : $(grep keyAlias   "$KEY" | cut -d= -f2)"

      # ── 6. Build Release APK ──────────────────────────────────────────────
      - name: Build Release APK
        script: |
          export PATH="$CM_BUILD_DIR/Offline-Smart-Toolkit/artifacts/mobile/node_modules/.bin:$PATH"
          MOBILE="$CM_BUILD_DIR/Offline-Smart-Toolkit/artifacts/mobile"
          LOG="$CM_BUILD_DIR/Offline-Smart-Toolkit/build-logs/release-apk.log"
          mkdir -p "$CM_BUILD_DIR/Offline-Smart-Toolkit/build-logs"

          # ── Pre-flight: confirm paths Gradle needs at configure time ────────
          echo "── node: $(node --version 2>&1)"
          echo "── react-native CLI: $(ls ${MOBILE}/node_modules/.bin/react-native 2>&1)"
          echo "── gradle-plugin local:     $(ls ${MOBILE}/node_modules/@react-native/gradle-plugin 2>/dev/null && echo OK || echo MISSING)"
          echo "── gradle-plugin workspace: $(ls $CM_BUILD_DIR/Offline-Smart-Toolkit/node_modules/@react-native/gradle-plugin 2>/dev/null && echo OK || echo MISSING)"

          cd "$MOBILE/android"
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --console=plain \
            --max-workers 2 \
            --stacktrace \
            --info \
            -PhermesEnabled=true \
            2>&1 | tee "$LOG"
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "══════════════════ LOG HEAD (first 120 lines) ══════════════════"
            head -120 "$LOG"
            echo ""
            echo "══════════════════ ERROR LINES ══════════════════"
            grep -En "What went wrong|Caused by:|> Could not|> Failed to|Cannot find|does not exist|FileNotFoundException|NoSuchMethodError|error:" "$LOG" \
              | head -40 || true
            echo "══════════════════════════════════════════════════"
          fi
          exit $BUILD_EXIT

      # ── 7. Build Release AAB (Play Store) ─────────────────────────────────
      - name: Build Release AAB
        script: |
          export PATH="$CM_BUILD_DIR/Offline-Smart-Toolkit/artifacts/mobile/node_modules/.bin:$PATH"
          mkdir -p "$CM_BUILD_DIR/Offline-Smart-Toolkit/build-logs"
          cd "$CM_BUILD_DIR/Offline-Smart-Toolkit/artifacts/mobile/android"
          chmod +x gradlew
          ./gradlew bundleRelease \
            --no-daemon \
            --console=plain \
            --max-workers 2 \
            --stacktrace \
            --info \
            -PhermesEnabled=true \
            2>&1 | tee "$CM_BUILD_DIR/Offline-Smart-Toolkit/build-logs/release-aab.log"
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            LOG="$CM_BUILD_DIR/Offline-Smart-Toolkit/build-logs/release-aab.log"
            echo ""
            echo "══════════════════ ROOT CAUSE ══════════════════"
            grep -n "What went wrong\|Caused by:\|> Could not\|> Failed to\|Cannot find\|does not exist\|is not a file\|FileNotFoundException\|NullPointerException\|ClassNotFoundException\|UnsupportedOperationException\|NoSuchMethodError\|error:" "$LOG" \
              | head -30 || true
            echo "══════════════════════════════════════════════"
          fi
          exit $BUILD_EXIT

    artifacts:
      - Offline-Smart-Toolkit/artifacts/mobile/android/app/build/outputs/apk/release/*.apk
      - Offline-Smart-Toolkit/artifacts/mobile/android/app/build/outputs/bundle/release/*.aab
      - Offline-Smart-Toolkit/artifacts/mobile/android/app/build/outputs/mapping/release/mapping.txt
      - Offline-Smart-Toolkit/build-logs/*.log

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
