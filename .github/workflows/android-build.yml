name: Android Release Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  build:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"
          sdkmanager --licenses <<< "y" 2>/dev/null || true

      # ── 4. Node 20 ───────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 5. pnpm ──────────────────────────────────────────────────────────────
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.26.1'

      # ── 6. pnpm cache ────────────────────────────────────────────────────────
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('Offline-Smart-Toolkit/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # ── 7. JS dependencies ───────────────────────────────────────────────────
      - name: Install JS dependencies
        working-directory: Offline-Smart-Toolkit
        run: pnpm install --frozen-lockfile

      # ── 8. Gradle cache ──────────────────────────────────────────────────────
      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('Offline-Smart-Toolkit/artifacts/mobile/android/**/*.gradle*', 'Offline-Smart-Toolkit/artifacts/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 9. local.properties ─────────────────────────────────────────────────
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" \
            > Offline-Smart-Toolkit/artifacts/mobile/android/local.properties

      # ── 10. Signing — use repo secrets if available, else committed keystore ─
      - name: Set up release signing
        working-directory: Offline-Smart-Toolkit/artifacts/mobile/android
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
            cat > key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF
            echo "Signing: using GitHub secret keystore"
          elif [ -f key.properties ] && [ -f app/release.keystore ]; then
            echo "Signing: using committed key.properties + release.keystore"
          else
            echo "ERROR: No signing credentials found. Add RELEASE_KEYSTORE_BASE64 secret or commit key.properties."
            exit 1
          fi

      # ── 11. Make gradlew executable ──────────────────────────────────────────
      - name: Make Gradle wrapper executable
        run: chmod +x Offline-Smart-Toolkit/artifacts/mobile/android/gradlew

      # ── 12. Build Release APK ────────────────────────────────────────────────
      - name: Build Release APK
        working-directory: Offline-Smart-Toolkit/artifacts/mobile/android
        env:
          PATH: ${{ github.workspace }}/Offline-Smart-Toolkit/artifacts/mobile/node_modules/.bin:$PATH
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --console=plain \
            --max-workers 2 \
            --stacktrace \
            -PhermesEnabled=true

      # ── 13. Build Release AAB ────────────────────────────────────────────────
      - name: Build Release AAB
        working-directory: Offline-Smart-Toolkit/artifacts/mobile/android
        env:
          PATH: ${{ github.workspace }}/Offline-Smart-Toolkit/artifacts/mobile/node_modules/.bin:$PATH
        run: |
          ./gradlew bundleRelease \
            --no-daemon \
            --console=plain \
            --max-workers 2 \
            --stacktrace \
            -PhermesEnabled=true

      # ── 14. Upload APK ───────────────────────────────────────────────────────
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: Offline-Smart-Toolkit/artifacts/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      # ── 15. Upload AAB ───────────────────────────────────────────────────────
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: Offline-Smart-Toolkit/artifacts/mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

      # ── 16. Upload ProGuard mapping (optional, for crash deobfuscation) ──────
      - name: Upload ProGuard mapping
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proguard-mapping
          path: Offline-Smart-Toolkit/artifacts/mobile/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: ignore
