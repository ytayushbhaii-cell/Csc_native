name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Offline-Smart-Toolkit/artifacts/mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: Offline-Smart-Toolkit/artifacts/mobile
        run: npm ci --legacy-peer-deps

      - name: Grant execute permission for gradlew
        run: chmod +x Offline-Smart-Toolkit/artifacts/mobile/android/gradlew

      - name: Build debug APK
        working-directory: Offline-Smart-Toolkit/artifacts/mobile/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: Offline-Smart-Toolkit/artifacts/mobile/android/app/build/outputs/apk/debug/app-debug.apk
