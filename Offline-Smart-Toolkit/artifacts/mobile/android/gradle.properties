# Project-wide Gradle settings.

# ── JVM ───────────────────────────────────────────────────────────────────────
# 3 GB for Gradle process + 1 GB for Kotlin daemon = ~4 GB total.
# Codemagic standard machines have 8 GB RAM; this leaves room for OS + NDK.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel off: some RN native modules have build-order dependencies on CI.
org.gradle.parallel=false
# Local cache unreliable in ephemeral CI containers.
org.gradle.caching=false
org.gradle.configureondemand=false
org.gradle.vfs.watch=false
org.gradle.daemon=false
# Configuration cache disabled — RN 0.81 Gradle plugin is not fully compatible yet.
org.gradle.configuration-cache=false

# ── Kotlin ────────────────────────────────────────────────────────────────────
# Separate Kotlin daemon avoids OOM when compiling inside the Gradle JVM.
# On Codemagic (8 GB machines) this is more stable than in-process compilation.
kotlin.daemon.enabled=true
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvm.options=-Xmx1g -Xms256m
# Incremental compilation disabled on CI — avoids stale incremental cache issues.
kotlin.incremental=false
# Kotlin 2.x raises an error when a module's jvmTarget mismatches a transitive
# dependency compiled for a different target. Use 'warning' so third-party RN
# native modules that haven't updated to JVM 17 don't abort the build.
kotlin.jvm.target.validation.mode=warning

# ── AndroidX ──────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enablePngCrunchInReleaseBuilds=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# ── Shrinking (disabled — minifyEnabled=false in build.gradle) ────────────────
android.enableMinifyInReleaseBuilds=false
android.enableShrinkResourcesInReleaseBuilds=false

# ── Architecture ──────────────────────────────────────────────────────────────
reactNativeArchitectures=arm64-v8a

# ── New Architecture ──────────────────────────────────────────────────────────
newArchEnabled=false

# ── Hermes ────────────────────────────────────────────────────────────────────
hermesEnabled=true

# ── Edge-to-edge ──────────────────────────────────────────────────────────────
edgeToEdgeEnabled=true
