distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# AGP 8.11.0 requires Gradle 8.11.1+.
# Using 8.11.1 (not 8.13) because Gradle 8.12+ broke settings-phase plugin
# resolution for com.facebook.react.settings (a subproject plugin inside the
# @react-native/gradle-plugin includeBuild composite). Gradle 8.11.1 resolves
# it correctly via the standard `plugins { id("com.facebook.react.settings") }`
# + pluginManagement includeBuild approach without any JAR-loading workarounds.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
