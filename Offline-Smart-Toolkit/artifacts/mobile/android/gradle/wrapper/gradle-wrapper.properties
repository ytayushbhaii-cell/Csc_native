distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# AGP 8.11.0 requires Gradle 8.13+.
# Using 8.14.3 (same version used in step 3b to build the RN Gradle plugin JARs).
# Previously pinned to 8.11.1 to work around a com.facebook.react.settings
# includeBuild issue, but that plugin is now loaded via pre-compiled JAR classpath
# (no includeBuild dependency), so the version constraint is removed.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
