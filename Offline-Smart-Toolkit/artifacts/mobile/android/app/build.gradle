apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native configuration.
 * Codemagic installs JS deps to mobile/node_modules (pnpm workspace).
 * Gradle files use file() which resolves relative to each sub-project dir.
 */
def mobileRoot        = file("../..")          // Offline-Smart-Toolkit/artifacts/mobile
def mobileNodeModules = file("${mobileRoot}/node_modules")

// @react-native/codegen — needed for RN 0.81 type-safe natives
def codegenDir = file("${mobileNodeModules}/@react-native/codegen")
def reactNativeDir = file("${mobileNodeModules}/react-native")

react {
    entryFile      = file("${mobileRoot}/index.js")
    reactNativeDir = reactNativeDir
    hermesCommand  = "${reactNativeDir}/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir     = codegenDir
    // Explicitly point at the CLI package binary so the RN Gradle plugin
    // can run autolinking even when node_modules/.bin/react-native symlink
    // is absent (npm ci on Codemagic sometimes skips .bin wiring).
    cliFile        = file("${mobileNodeModules}/@react-native-community/cli/build/bin.js")
}

// ── Release signing from key.properties ──────────────────────────────────────
// key.properties lives at android/key.properties (rootProject dir).
// storeFile=release.keystore resolves relative to android/app/ (this module).
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion        rootProject.ext.ndkVersion
    compileSdk        rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    namespace "com.cscsmarttoolkit.app"

    defaultConfig {
        applicationId   "com.cscsmarttoolkit.app"
        minSdk          rootProject.ext.minSdkVersion
        targetSdk       rootProject.ext.targetSdkVersion
        versionCode     8
        versionName     "8.0.0"
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            storeFile     file('debug.keystore')
            storePassword 'android'
            keyAlias      'androiddebugkey'
            keyPassword   'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile     file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias      keystoreProperties['keyAlias']
                keyPassword   keystoreProperties['keyPassword']
            } else {
                // Fallback to env vars (Codemagic android_signing integration)
                storeFile     file(System.getenv("RELEASE_KEYSTORE_PATH") ?: 'debug.keystore')
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: 'android'
                keyAlias      System.getenv("RELEASE_KEY_ALIAS")         ?: 'androiddebugkey'
                keyPassword   System.getenv("RELEASE_KEY_PASSWORD")      ?: 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable    true
        }
        release {
            signingConfig    signingConfigs.release
            minifyEnabled    false
            shrinkResources  false
            proguardFiles    getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            debuggable       false
        }
    }

    // arm64-v8a only — matches Play Store ABI split strategy
    splits {
        abi {
            reset()
            enable       true
            universalApk false
            include      "arm64-v8a"
        }
    }

    packaging {
        // Resolve duplicate .so conflicts from ONNX Runtime, TF.js, Reanimated,
        // Vision Camera, and other native modules.
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libfbjni.so'
        pickFirst '**/libonnxruntime.so'
        pickFirst '**/libjsc.so'
        pickFirst '**/libhermes.so'
        pickFirst '**/libVisionCamera.so'
        exclude   '**/libjsc.so'          // Use Hermes only
        exclude   'META-INF/DEPENDENCIES'
        exclude   'META-INF/LICENSE'
        exclude   'META-INF/LICENSE.txt'
        exclude   'META-INF/NOTICE'
        exclude   'META-INF/NOTICE.txt'
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    lint {
        abortOnError       false
        checkReleaseBuilds false
        // Suppress noisy warnings from third-party RN native modules
        disable            'InvalidPackage', 'OldTargetApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    def hermesEnabled = project.properties['hermesEnabled'] ?: 'true'
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation("com.facebook.react:jsc-android")
    }
}
