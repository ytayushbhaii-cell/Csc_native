// Top-level build file — configuration shared by all sub-projects/modules.

buildscript {
    ext {
        // ── SDK / Tools ──────────────────────────────────────────────────────
        // SDK 35 (Android 15) is pre-installed on all Codemagic machines.
        // SDK 36 (Android 16) is too new for most CI runners → downgraded.
        buildToolsVersion  = "35.0.0"
        minSdkVersion      = 24
        compileSdkVersion  = 35
        targetSdkVersion   = 35
        ndkVersion         = "27.1.12297006"

        // ── Kotlin / AGP ─────────────────────────────────────────────────────
        // React Native 0.81's Gradle plugin is built against this AGP/Kotlin pair.
        kotlinVersion = "2.1.20"
        // RN 0.81 publishes the Android runtime as react-android. Some
        // autolinked libraries (including slider 5.x) still request the
        // pre-0.76 react-native Maven artifact.
        reactNativeVersion = findProperty("REACT_NATIVE_VERSION") ?: "0.81.5"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20")
    }
}

plugins {
    id("com.facebook.react.rootproject")
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }

    // Keep legacy React Native Android library dependencies compatible with
    // RN 0.81 without modifying files inside node_modules. RN 0.81 no longer
    // publishes the old com.facebook.react:react-native Maven coordinate.
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.facebook.react" &&
                details.requested.name == "react-native") {
                details.useTarget(
                    "com.facebook.react:react-android:${rootProject.ext.reactNativeVersion}"
                )
                details.because("React Native 0.81 publishes react-android instead of react-native")
            }
        }
    }
}
