workflows:
  csc-smart-toolkit-android:
    name: CSC Smart Toolkit — Android Release
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: "com.cscsmarttoolkit.app"
      node: 20.18.0
      java: 17

    scripts:
      # ── 1. Install pnpm ────────────────────────────────────────────────────
      - name: Install pnpm
        script: npm install -g pnpm@10.26.1

      # ── 2. JS dependencies (pnpm workspace) ───────────────────────────────
      - name: Install JS dependencies
        script: |
          cd $CM_BUILD_DIR/Offline-Smart-Toolkit
          pnpm install --no-frozen-lockfile

      # ── 3. Android SDK components ─────────────────────────────────────────
      - name: Accept Android SDK licences & install components
        script: |
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006" \
            2>/dev/null || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > \
            $CM_BUILD_DIR/Offline-Smart-Toolkit/artifacts/mobile/android/local.properties

      # ── 4. Verify signing files ────────────────────────────────────────────
      - name: Verify signing files
        script: |
          KEY="$CM_BUILD_DIR/Offline-Smart-Toolkit/artifacts/mobile/android/key.properties"
          KS="$CM_BUILD_DIR/Offline-Smart-Toolkit/artifacts/mobile/android/app/release.keystore"
          [ -f "$KEY" ] && echo "✓ key.properties found" || { echo "✗ MISSING: key.properties"; exit 1; }
          [ -f "$KS"  ] && echo "✓ release.keystore found" || { echo "✗ MISSING: release.keystore"; exit 1; }

      # ── 5. Build Release APK ──────────────────────────────────────────────
      - name: Build Release APK
        script: |
          export PATH="$CM_BUILD_DIR/Offline-Smart-Toolkit/artifacts/mobile/node_modules/.bin:$PATH"
          mkdir -p $CM_BUILD_DIR/Offline-Smart-Toolkit/build-logs
          cd $CM_BUILD_DIR/Offline-Smart-Toolkit/artifacts/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --console=plain \
            --max-workers 2 \
            --stacktrace \
            -PhermesEnabled=true \
            2>&1 | tee $CM_BUILD_DIR/Offline-Smart-Toolkit/build-logs/release-apk.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""; echo "══ FIRST FAILURE LINE ══"
            grep -m1 "FAILURE\|error:\|Exception\|What went wrong" \
              $CM_BUILD_DIR/Offline-Smart-Toolkit/build-logs/release-apk.log || true
          fi
          exit $BUILD_EXIT

      # ── 6. Build Release AAB (Play Store) ─────────────────────────────────
      - name: Build Release AAB
        script: |
          export PATH="$CM_BUILD_DIR/Offline-Smart-Toolkit/artifacts/mobile/node_modules/.bin:$PATH"
          mkdir -p $CM_BUILD_DIR/Offline-Smart-Toolkit/build-logs
          cd $CM_BUILD_DIR/Offline-Smart-Toolkit/artifacts/mobile/android
          ./gradlew bundleRelease \
            --no-daemon \
            --console=plain \
            --max-workers 2 \
            --stacktrace \
            -PhermesEnabled=true \
            2>&1 | tee $CM_BUILD_DIR/Offline-Smart-Toolkit/build-logs/release-aab.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""; echo "══ FIRST FAILURE LINE ══"
            grep -m1 "FAILURE\|error:\|Exception\|What went wrong" \
              $CM_BUILD_DIR/Offline-Smart-Toolkit/build-logs/release-aab.log || true
          fi
          exit $BUILD_EXIT

    artifacts:
      - Offline-Smart-Toolkit/artifacts/mobile/android/app/build/outputs/apk/release/*.apk
      - Offline-Smart-Toolkit/artifacts/mobile/android/app/build/outputs/bundle/release/*.aab
      - Offline-Smart-Toolkit/artifacts/mobile/android/app/build/outputs/mapping/release/mapping.txt
      - Offline-Smart-Toolkit/build-logs/*.log

    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
